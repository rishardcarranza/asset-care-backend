services:
  db:
    image: postgres:16-alpine
    container_name: asset_care_db
    restart: always
    env_file:
      - .env
    volumes:
      - asset_care_postgres_data:/var/lib/postgresql/data
    networks:
      - assetcare_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${GHCR_IMAGE:-ghcr.io/rishardcarranza/asset-care-backend:latest}
    container_name: asset_care_api
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - assetcare_net
      - coretex_net

volumes:
  asset_care_postgres_data:

networks:
  assetcare_net:
    driver: bridge
  coretex_net:
    external: true
    name: ${CORETEX_NETWORK:-coretex_coretex_net}

